[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hoi4-copilot"
version = "0.1.0"
description = "MCP server + memory layer that lets an external agent play Hearts of Iron IV like a player (single-player, non-ironman, no console cheats)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "pefile>=2024.8.26",
    "pymem>=1.14.0",
    "psutil>=5.9",
    "numpy>=1.26",
    "capstone>=5.0",
    "mss>=9.0",
]

[project.scripts]
hoi4-selftest = "hoi4copilot.selftest:main"
hoi4-server = "hoi4copilot.mcp_server:main"

[tool.setuptools.packages.find]
include = ["hoi4copilot*"]
